name: Generate Release Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate release keystore (one-time)
        run: |
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias nuage -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=NuAge, OU=Dev, O=NuAge, L=City, S=State, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release-key.jks