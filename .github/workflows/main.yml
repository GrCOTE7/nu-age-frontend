name: Build Nu Age APK (Manual Env Mode)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # NOTE: We intentionally do NOT install Flutter via subosito/flutter-action here.
      # flet-cli manages/downloads the exact Flutter SDK version its build template
      # requires (see `flet doctor` / release notes for the pinned version per flet
      # release). Pre-installing an unrelated "stable" Flutter puts a mismatched
      # version on PATH that flet-cli will pick up instead of the one it needs,
      # which was a secondary contributor to the original failure.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          # IMPORTANT: All flet-* packages must be pinned to the SAME patch version,
          # and NOT to 0.86.0 specifically.
          #
          # flet==0.86.0 / flet-charts==0.86.0 (released 2026-07-14) shipped a rewrite
          # of MatplotlibChartCanvas onto a new DataChannel transport. The Dart-side
          # infra it depends on (FrameStreamVisibility mixin, disposeReplaced(),
          # disposeReplacedAll(), the `visible` getter) was only completed in a later
          # patch (flet PR #6691) — 0.86.0 shipped referencing APIs that did not exist
          # yet, which is exactly the Dart compile error in flet_charts'
          # matplotlib_chart_canvas.dart ("Type 'FrameStreamVisibility' not found",
          # "Error: The method 'disposeReplaced' isn't defined for the type ...").
          #
          # flet-charts patched this rapidly: 0.86.0 -> 0.86.1 -> 0.86.2 -> 0.86.3 ->
          # 0.86.4, all within ~2 weeks. Pin to the latest 0.86.x patch instead.
          #
          # Verify the current latest patch before building:
          #   pip index versions flet
          #   pip index versions flet-charts
          pip install flet-cli==0.86.4 flet==0.86.4 flet-video==0.86.4 flet-charts==0.86.4 httpx==0.28.1 requests==2.32.3

      - name: Verify matching flet toolchain versions
        run: |
          # Fail fast instead of getting a cryptic Dart compile error 3 minutes
          # into a Gradle build if the pins ever drift out of lockstep again.
          python -c "
          import importlib.metadata as m
          pkgs = ['flet', 'flet-cli', 'flet-video', 'flet-charts']
          versions = {p: m.version(p) for p in pkgs}
          print(versions)
          vals = set(versions.values())
          assert len(vals) == 1, f'flet-family version mismatch: {versions}'
          "
          flet doctor

      - name: Clean Flet build cache
        run: rm -rf build .flet_build ~/.flet 2>/dev/null || true

      - name: Compile the APK
        run: |
          set -o pipefail
          if ! yes | flet build apk --product "Nu Age" --verbose 2>&1 | tee flet_build.log; then
            echo "::error::CRITICAL ERROR: Flet compiler crashed! Check verbose logs for Dart/Python errors."
            exit 1
          fi

      - name: Show extra logs on failure
        if: failure()
        run: tail -n 400 flet_build.log || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: flet_build.log

      - name: Rename the APK file
        run: |
          cd build/apk
          mv *.apk "Nu Age.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nu Age App
          path: build/apk/Nu Age.apk