name: Build Nu Age APK (Manual Env Mode)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.4'   # matches what flet-cli 0.84.0 expects

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install flet-cli==0.84.0 flet==0.84.0 httpx==0.28.1 requests==2.32.3
          # --no-deps prevents these extras from silently pulling a newer
          # Flutter/Dart-requiring sub-dependency behind your back
          pip install flet-video==0.84.0 flet-charts==0.84.0 --no-deps

      - name: Clean Flet build cache
        run: |
          rm -rf build .flet_build ~/.flet 2>/dev/null || true

      - name: Compile the APK
        run: |
          set -o pipefail
          if ! flet build apk --product "Nu Age" --verbose --build-verbose 2>&1 | tee flet_build.log; then
            echo "::error::CRITICAL ERROR: Flet compiler crashed! Check verbose logs for Dart/Python errors."
            exit 1
          fi

      - name: Show extra logs on failure
        if: failure()
        run: |
          echo "----- flet_build.log tail -----"
          tail -n 400 flet_build.log || true
          echo "----- Gradle reports -----"
          find . -path "*/build/reports/*" -o -name "*.log" 2>/dev/null | xargs -I{} sh -c 'echo ---{}---; cat {}' || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            flet_build.log
            **/build/reports/**

      - name: Rename the APK file
        run: |
          cd build/apk
          mv *.apk "Nu Age.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nu Age App
          path: build/apk/Nu Age.apk